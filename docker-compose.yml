# Full local stack: `docker compose up` runs Postgres AND the web app.
# web builds the Next.js image, waits for a healthy DB, applies the
# Prisma schema, and serves http://localhost:3000. (.env's localhost
# DATABASE_URL is for host-side tooling; the web container uses `db`.)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partner_coach_bot
    ports:
      - "54CC:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d partner_coach_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/partner_coach_bot?schema=public"
      AI_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "gemma4:26b"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # apply the schema on boot, then serve the production build
    command: sh -c "pnpm prisma db push --skip-generate && pnpm start"

volumes:
  pgdata:
